  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 15% 10%, rgba(37, 99, 235, 0.28), transparent 30%),
        radial-gradient(circle at 85% 25%, rgba(59, 130, 246, 0.18), transparent 30%),
        linear-gradient(135deg, #020617, #071b3a 50%, #06152d);
      color: #ffffff;

    }

    /* NAVIGATION (same as index.html) */

    nav {
      min-height: 76px;
      flex-wrap: wrap;
      row-gap: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 50px;

      background: rgba(2, 6, 23, 0.72);
      border-bottom: 1px solid rgba(96, 165, 250, 0.18);

      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
  flex-shrink: 0;
      position: relative;
      display: inline-block;
      font-size: 19px;
      font-weight: 700;
      letter-spacing: 0.5px;
      white-space: nowrap;
      color: white;
      text-decoration: none;

      transition: transform 0.3s ease, text-shadow 0.3s ease;
    }

    .logo:hover {
      transform: translateY(-1px);
      text-shadow: 0 8px 14px rgba(0, 0, 0, 0.8);
    }

    .logo-shine {
      position: relative;
      display: inline-block;
      overflow: hidden;
    }

    .logo-shine::after {
      content: "";
      position: absolute;
      top: 0;
      left: -40%;
      width: 22%;
      height: 100%;

      background: linear-gradient(
        100deg,
        transparent 0%,
        rgba(255, 255, 255, 0.18) 45%,
        rgba(255, 255, 255, 0.3) 50%,
        rgba(255, 255, 255, 0.18) 55%,
        transparent 100%
      );

      pointer-events: none;
    }

    .logo:hover .logo-shine::after {
      left: 120%;
      transition: left 0.9s ease;
    }

    .logo-shine::after {
      transition: left 0s;
    }

    .nav-links {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 24px;
      list-style: none;
    }

    .nav-links a {
      color: #dbeafe;
      text-decoration: none;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.15;
      text-align: center;
      white-space: nowrap;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: #60a5fa;
    }

    .nav-search {
      display: flex;
      align-items: center;
    }

    #search-form {
      display: flex;
      align-items: center;
      height: 34px;
    }

    #search-input {
      width: 120px;
      height: 34px;

      padding: 0 12px;

      border: 1px solid rgba(96, 165, 250, 0.3);
      border-right: none;
      border-radius: 7px 0 0 7px;

      background: rgba(15, 23, 42, 0.8);
      color: white;

      font-size: 12px;
      outline: none;
    }

    #search-input::placeholder {
      color: rgba(219, 234, 254, 0.55);
    }

    #search-input:focus {
      border-color: rgba(96, 165, 250, 0.7);
    }

    #search-form button {
      width: 36px;
      height: 34px;

      border: 1px solid rgba(96, 165, 250, 0.3);
      border-radius: 0 7px 7px 0;

      background: rgba(37, 99, 235, 0.35);
      color: white;

      font-size: 18px;
      cursor: pointer;
    }

    #search-form button:hover {
      background: rgba(37, 99, 235, 0.6);
    }

    .account-link {
      color: #dbeafe;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      margin-left: 28px;
    }

    .account-link:hover {
      color: #60a5fa;
    }

.lang-switcher {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
  margin-left: 22px;
  padding-left: 22px;
  border-left: 1px solid rgba(96, 165, 250, 0.2);
}

#account-nav {
  flex-shrink: 0;
}

.lang-switcher button {
  background: none;
  border: none;
  padding: 4px 6px;
  color: rgba(219, 234, 254, 0.55);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  border-radius: 4px;
}

.lang-switcher button:hover {
  color: #dbeafe;
}

.lang-switcher button.active {
  color: #60a5fa;
  background: rgba(37, 99, 235, 0.18);
}

    .profile-nav-icon {
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      text-decoration: none;

    @media (max-width: 800px) {

      }

    }

    /* ARTICLE */

    main {
      max-width: 1150px;
      margin: auto;
      padding: 50px 25px 90px;
    }

    #back-link {
      display: inline-block;
      margin-bottom: 24px;
      color: #93c5fd;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }

    #back-link:hover {
      color: #60a5fa;
    }

    /* the sheet */

    #article-sheet {
      background: #f4f1ea;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);
    }

    #article-image {
      width: 100%;
      max-height: 420px;
      object-fit: cover;
      display: none;
    }

    #article-body {
      padding: 50px 60px 60px;
    }

    #article-title {
      font-family: Georgia, 'Times New Roman', Times, serif;
      font-size: 46px;
      font-weight: 700;
      letter-spacing: 0.2px;
      line-height: 1.2;
      margin-bottom: 18px;
      color: #0f0f0f;
    }

    #article-meta {
      font-family: Georgia, 'Times New Roman', Times, serif;
      font-size: 15px;
      font-weight: 600;
      font-style: italic;
      color: #8a7f5e;
      margin-bottom: 36px;
      padding-bottom: 30px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
    }

    #article-content {
      font-family: Georgia, 'Times New Roman', Times, serif;
      font-size: 21px;
      line-height: 1.8;
      color: #101010;
    }

    #article-content p {
      margin-bottom: 22px;
      text-indent: 2.2em;
      overflow-wrap: break-word;
      word-break: break-word;
    }

    #status-message {
      font-size: 15px;
      color: rgba(219, 234, 254, 0.75);
    }

    @media (max-width: 600px) {
      #article-body {
        padding: 30px 25px 40px;
      }

      #article-title {
        font-size: 30px;
      }

      #article-content {
        font-size: 18px;
      }
    }

    /* COMMENTS */

    #comments-section {
      margin-top: 45px;
    }

    #comments-title {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 22px;
    }

    .comment-form {
      background: rgba(23, 45, 80, 0.55);
      border: 1px solid rgba(96, 165, 250, 0.18);
      border-radius: 12px;
      padding: 22px;
      margin-bottom: 30px;
    }

    .comment-form input,
    .comment-form textarea {
      width: 100%;
      box-sizing: border-box;

      padding: 11px 13px;

      border: 1px solid rgba(96, 165, 250, 0.3);
      border-radius: 7px;

      background: rgba(15, 23, 42, 0.8);
      color: white;

      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;

      outline: none;

      margin-bottom: 12px;
    }

    .comment-form input::placeholder,
    .comment-form textarea::placeholder {
      color: rgba(219, 234, 254, 0.5);
    }

    .comment-form input:focus,
    .comment-form textarea:focus {
      border-color: rgba(96, 165, 250, 0.7);
    }

    .comment-form textarea {
      min-height: 90px;
      resize: vertical;
    }

    .comment-form button {
      padding: 10px 22px;

      border: none;
      border-radius: 7px;

      background: rgba(37, 99, 235, 0.55);
      color: white;

      font-size: 14px;
      font-weight: 600;

      cursor: pointer;

      transition: background 0.2s ease;
    }

    .comment-form button:hover {
      background: rgba(37, 99, 235, 0.85);
    }

    .comment-form-message {
      margin-top: 10px;
      font-size: 13px;
      color: #93c5fd;
    }

    #comments-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .comment {
      background: rgba(23, 45, 80, 0.4);
      border: 1px solid rgba(96, 165, 250, 0.15);
      border-radius: 10px;
      padding: 16px 18px;
    }

    .comment-name {
      font-size: 14px;
      font-weight: 700;
      color: #f8fafc;
      margin-bottom: 6px;
    }

    .comment-text {
      font-size: 14px;
      line-height: 1.6;
      color: #dbeafe;
      white-space: pre-wrap;
      margin-bottom: 8px;
    }

    .comment-footer {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .comment-date {
      font-size: 12px;
      color: rgba(219, 234, 254, 0.55);
    }

    .comment-reply-toggle {
      background: none;
      border: none;
      color: #93c5fd;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      padding: 0;
    }

    .comment-reply-toggle:hover {
      color: #60a5fa;
    }

    .comment-replies {
      margin-top: 14px;
      margin-left: 22px;
      padding-left: 16px;
      border-left: 2px solid rgba(96, 165, 250, 0.25);

      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .comment-reply-form {
      display: none;
      margin-top: 14px;
    }

    .comment-reply-form.active {
      display: block;
    }

    .comments-loading,
    .no-comments {
      color: rgba(219, 234, 254, 0.65);
      font-size: 14px;
    }
  </style>

  <main>

    <a id="back-link" href="/news.html">← Back to News</a>

    <div id="status-message"></div>

    <div id="article-sheet">

      <img id="article-image" src="" alt="">

  <script>

    function formatDate(dateString) {

      if (!dateString) {
        return "";
      }

      const date = new Date(dateString);

      return date.toLocaleDateString("en-US", {
        year: "numeric",
        month: "long",
        day: "numeric"
      });
    }


    async function loadArticle() {

      const params =
        new URLSearchParams(window.location.search);

      const slug =
        params.get("slug");

      const statusMessage =
        document.getElementById("status-message");

      if (!slug) {
        statusMessage.textContent =
          "No article specified.";
        return;
      }

      try {

        const response = await fetch(
          `/api/movies?type=news&slug=${encodeURIComponent(slug)}&lang=${getSiteLanguage()}`
        );

        const data =
          await response.json();

        if (!response.ok) {
          statusMessage.textContent =
            data.error === "Article not found"
              ? "This article doesn't exist or isn't published."
              : "Unable to load article.";
          return;
        }

        document.title =
          data.title + " | Find Your Next Favorite Movie";

        const articleDescription =
          data.excerpt || data.content.slice(0, 160);

        document
          .querySelector('meta[name="description"]')
          .setAttribute("content", articleDescription);

        document
          .querySelector('meta[property="og:title"]')
          .setAttribute("content", data.title);

        document
          .querySelector('meta[property="og:description"]')
          .setAttribute("content", articleDescription);

        if (data.image_url) {
          document
            .querySelector('meta[property="og:image"]')
            .setAttribute("content", data.image_url);
        }

        const structuredData = {
          "@context": "https://schema.org",
          "@type": "NewsArticle",
          "headline": data.title,
          "description": articleDescription,
          "datePublished": data.published_at,
          "dateModified": data.updated_at || data.published_at,
          "author": {
            "@type": "Person",
            "name": data.author || "Admin"
          },
          "publisher": {
            "@type": "Organization",
            "name": "Find Your Next Favorite Movie"
          },
          "mainEntityOfPage": {
            "@type": "WebPage",
            "@id": window.location.href
          }
        };

        if (data.image_url) {
          structuredData.image = [data.image_url];
        }

        const structuredDataScript = document.createElement("script");
        structuredDataScript.type = "application/ld+json";
        structuredDataScript.textContent = JSON.stringify(structuredData);
        document.head.appendChild(structuredDataScript);

        document.getElementById("article-title").textContent =
          data.title;

        document.getElementById("article-meta").textContent =
          `${data.author || "Admin"} · ${formatDate(data.published_at)}`;

        const contentContainer =
          document.getElementById("article-content");

        contentContainer.innerHTML = "";

        const paragraphs = data.content
          .split(/\n\s*\n/)
          .map(p => p.trim())
          .filter(p => p.length > 0);

        for (const paragraphText of paragraphs) {

          const p = document.createElement("p");
          p.textContent = paragraphText;

          contentContainer.appendChild(p);
        }

        if (data.image_url) {
          const image =
            document.getElementById("article-image");

          image.src = data.image_url;
          image.alt = data.title;
          image.style.display = "block";
        }

        currentArticleId = data.id;
        loadComments();

      } catch (error) {

        console.error(error);

        statusMessage.textContent =
          "Unable to connect to the server.";

      }
    }

    let currentArticleId = null;

    loadArticle();


    // =========================
    // COMMENTS
    // =========================

    const commentForm =
      document.getElementById("comment-form");

    const commentName =
      document.getElementById("comment-name");

    const commentText =
      document.getElementById("comment-text");

    const commentFormMessage =
      document.getElementById("comment-form-message");

    const commentsList =
      document.getElementById("comments-list");


    function formatCommentDate(dateString) {

      if (!dateString) {
        return "";
      }

      const date = new Date(dateString);

      return date.toLocaleDateString("en-US", {
        year: "numeric",
        month: "short",
        day: "numeric"
      });
    }


    function createCommentElement(comment, allComments) {

      const wrapper =
        document.createElement("div");

      wrapper.className = "comment";

      const name =
        document.createElement("div");

      name.className = "comment-name";
      name.textContent = comment.author_name;

      const text =
        document.createElement("div");

      text.className = "comment-text";
      text.textContent = comment.content;

      const footer =
        document.createElement("div");

      footer.className = "comment-footer";

      const date =
        document.createElement("span");

      date.className = "comment-date";
      date.textContent = formatCommentDate(comment.created_at);

      const replyToggle =
        document.createElement("button");

      replyToggle.type = "button";
      replyToggle.className = "comment-reply-toggle";
      replyToggle.textContent = "Reply";

      footer.appendChild(date);
      footer.appendChild(replyToggle);

      wrapper.appendChild(name);
      wrapper.appendChild(text);
      wrapper.appendChild(footer);


      const replyForm =
        document.createElement("form");

      replyForm.className = "comment-reply-form";

      replyForm.innerHTML = `
        <input
          type="text"
          placeholder="Your name"
          maxlength="50"
          class="reply-name"
          required
        >

        <textarea
          placeholder="Write a reply..."
          maxlength="2000"
          class="reply-text"
          required
        ></textarea>

        <button type="submit">
          Post Reply
        </button>

        <div class="comment-form-message reply-message"></div>
      `;

      wrapper.appendChild(replyForm);

      replyToggle.addEventListener("click", () => {
        replyForm.classList.toggle("active");
      });

      replyForm.addEventListener("submit", async event => {

        event.preventDefault();

        const replyNameInput =
          replyForm.querySelector(".reply-name");

        const replyTextInput =
          replyForm.querySelector(".reply-text");

        const replyMessage =
          replyForm.querySelector(".reply-message");

        const name = replyNameInput.value.trim();
        const content = replyTextInput.value.trim();

        if (!name || !content) {
          replyMessage.textContent =
            "Please fill in your name and reply.";
          return;
        }

        replyMessage.textContent = "Posting reply...";

        try {

          const response = await fetch("/api/user-comments.js", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              article_id: currentArticleId,
              parent_id: comment.id,
              name,
              content
            })
          });

          const data = await response.json();

          if (!response.ok) {
            replyMessage.textContent =
              data.error || "Could not post reply.";
            return;
          }

          replyNameInput.value = "";
          replyTextInput.value = "";
          replyMessage.textContent = "";

          replyForm.classList.remove("active");

          loadComments();

        } catch (error) {

          console.error(error);

          replyMessage.textContent =
            "Unable to connect to the server.";
        }
      });


      const children =
        allComments.filter(
          c => c.parent_id === comment.id
        );

      if (children.length > 0) {

        const repliesContainer =
          document.createElement("div");

        repliesContainer.className = "comment-replies";

        children.forEach(child => {
          repliesContainer.appendChild(
            createCommentElement(child, allComments)
          );
        });

        wrapper.appendChild(repliesContainer);
      }

      return wrapper;
    }


    async function loadComments() {

      if (!currentArticleId) {
        return;
      }

      try {

        const response = await fetch(
          `/api/user-comments.js?article_id=${currentArticleId}`
        );

        const data = await response.json();

        if (!response.ok) {
          throw new Error("Could not load comments");
        }

        commentsList.innerHTML = "";

        const allComments = data.comments || [];

        const topLevel =
          allComments.filter(c => c.parent_id === null);

        if (topLevel.length === 0) {
          commentsList.innerHTML =
            `<p class="no-comments">No comments yet. Be the first to share your thoughts!</p>`;
          return;
        }

        topLevel.forEach(comment => {
          commentsList.appendChild(
            createCommentElement(comment, allComments)
          );
        });

      } catch (error) {

        console.error("Error loading comments:", error);

        commentsList.innerHTML =
          `<p class="no-comments">Could not load comments.</p>`;
      }
    }


    commentForm.addEventListener("submit", async event => {

      event.preventDefault();

      const name = commentName.value.trim();
      const content = commentText.value.trim();

      if (!name || !content) {
        commentFormMessage.textContent =
          "Please fill in your name and comment.";
        return;
      }

      if (!currentArticleId) {
        commentFormMessage.textContent =
          "Please wait for the article to finish loading.";
        return;
      }

      commentFormMessage.textContent = "Posting comment...";

      try {

        const response = await fetch("/api/user-comments.js", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            article_id: currentArticleId,
            parent_id: null,
            name,
            content
          })
        });

        const data = await response.json();

        if (!response.ok) {
          commentFormMessage.textContent =
            data.error || "Could not post comment.";
          return;
        }

        commentName.value = "";
        commentText.value = "";
        commentFormMessage.textContent = "Comment posted!";

        loadComments();

      } catch (error) {

        console.error(error);

        commentFormMessage.textContent =
          "Unable to connect to the server.";
      }
    });


    // =========================
    // ACCOUNT NAV (same as index.html)
    // =========================

    async function updateAccountNav() {
      const accountNav = document.getElementById("account-nav");

      if (!accountNav) return;

      try {

  /* LANGUAGE SWITCHER */

  function getSiteLanguage() {
    const match = document.cookie.match(/googtrans=\/en\/([a-zA-Z-]+)/);

    if (!match) {
      return "en";
    }

    const code = match[1].toLowerCase();

    if (code === "es") {
      return "es";
    }

    if (code === "zh-cn") {
      return "zh";
    }

    return "en";
  }

  function setSiteLanguage(lang) {

    document.cookie =
      "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";

    if (lang !== "en") {

      const googleCode =
        lang === "zh" ? "zh-CN" : lang;

      document.cookie =
        `googtrans=/en/${googleCode}; path=/`;
    }

    location.reload();
  }

  function highlightActiveLanguageButton() {
    const currentLang = getSiteLanguage();

    document
      .querySelectorAll("#lang-switcher button")
      .forEach(button => {
        button.classList.toggle(
          "active",
          button.dataset.lang === currentLang
        );
      });
  }

  document
    .querySelectorAll("#lang-switcher button")
    .forEach(button => {
      button.addEventListener("click", () => {
        setSiteLanguage(button.dataset.lang);
      });
    });

  highlightActiveLanguageButton();

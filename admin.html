<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 60px auto;
      padding: 20px;
    }

    h1 {
      margin-bottom: 30px;
    }

    h2 {
      margin-top: 60px;
      margin-bottom: 10px;
      border-top: 1px solid #ccc;
      padding-top: 40px;
    }

    label {
      display: block;
      margin-top: 20px;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      font-size: 16px;
    }

    textarea {
      min-height: 180px;
      resize: vertical;
    }

    button {
      margin-top: 25px;
      padding: 12px 24px;
      font-size: 16px;
      cursor: pointer;
    }

    #editor {
      display: none;
    }

    #news-editor {
      display: none;
    }

    #message,
    #news-message {
      margin-top: 20px;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 20px;
    }

    .checkbox-row label {
      margin: 0;
    }

    .checkbox-row input {
      width: auto;
    }
  </style>
</head>

<body>

  <h1>Review Editor</h1>

  <!-- LOGIN -->

  <div id="login">

    <label for="password">
      Admin password
    </label>

    <input
      id="password"
      type="password"
      autocomplete="current-password"
    >

    <button id="login-button">
      Login
    </button>

    <div id="login-message"></div>

  </div>


  <!-- REVIEW EDITOR -->

  <div id="editor">

    <label for="movie-id">
      Movie ID
    </label>

    <input
      id="movie-id"
      type="number"
      placeholder="Example: 550"
    >

    <label for="rating">
      Rating
    </label>

    <input
      id="rating"
      type="number"
      min="0"
      max="10"
      step="0.1"
      placeholder="Example: 8.5"
    >

    <label for="review">
      Review
    </label>

    <textarea
      id="review"
      placeholder="Write your review..."
    ></textarea>

    <button id="save-button">
      Save Review
    </button>

    <div id="message"></div>

  </div>


  <!-- NEWS EDITOR -->

  <div id="news-editor">

    <h2>News Editor</h2>

    <label for="article-id">
      Article ID (leave empty to create a new article)
    </label>

    <input
      id="article-id"
      type="number"
      placeholder="Leave empty for a new article"
    >

    <button id="load-article-button" type="button">
      Load Article
    </button>

    <div id="load-message"></div>

    <label for="article-title">
      Title
    </label>

    <input
      id="article-title"
      type="text"
      placeholder="Article title"
    >

    <label for="article-slug">
      Slug
    </label>

    <input
      id="article-slug"
      type="text"
      placeholder="example-article-title"
    >

    <label for="article-excerpt">
      Excerpt
    </label>

    <input
      id="article-excerpt"
      type="text"
      placeholder="Short summary shown in the article list"
    >

    <label for="article-author">
      Author
    </label>

    <input
      id="article-author"
      type="text"
      placeholder="Admin"
    >

    <label for="article-image">
      Image URL
    </label>

    <input
      id="article-image"
      type="text"
      placeholder="https://..."
    >

    <label for="article-content">
      Content
    </label>

    <textarea
      id="article-content"
      placeholder="Write the article..."
    ></textarea>

    <div class="checkbox-row">
      <input
        id="article-published"
        type="checkbox"
      >
      <label for="article-published">
        Published
      </label>
    </div>

    <button id="save-article-button">
      Save Article
    </button>

    <div id="news-message"></div>

  </div>


  <script>

    const loginSection =
      document.getElementById("login");

    const editorSection =
      document.getElementById("editor");

    const newsEditorSection =
      document.getElementById("news-editor");

    const loginMessage =
      document.getElementById("login-message");

    const message =
      document.getElementById("message");

    const newsMessage =
      document.getElementById("news-message");


    // =========================
    // LOGIN
    // =========================

    document
      .getElementById("login-button")
      .addEventListener("click", async () => {

        const password =
          document.getElementById("password").value;

        if (!password) {
          loginMessage.textContent =
            "Please enter your password.";
          return;
        }

        try {

          const response = await fetch(
            "/api/admin-login",
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json"
              },
              credentials: "include",
              body: JSON.stringify({
                password
              })
            }
          );

          const data =
            await response.json();

          if (!response.ok) {
            loginMessage.textContent =
              data.error || "Login failed.";
            return;
          }

          loginSection.style.display =
            "none";

          editorSection.style.display =
            "block";

          newsEditorSection.style.display =
            "block";

        } catch (error) {

          console.error(error);

          loginMessage.textContent =
            "Unable to connect to the server.";

        }

      });


    // =========================
    // SAVE REVIEW
    // =========================

    document
      .getElementById("save-button")
      .addEventListener("click", async () => {

        const movieId =
          document.getElementById("movie-id").value;

        const rating =
          document.getElementById("rating").value;

        const review =
          document.getElementById("review").value;

        if (!movieId || rating === "") {

          message.textContent =
            "Movie ID and rating are required.";

          return;
        }

        try {

          const response = await fetch(
            "/api/save-review",
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json"
              },
              credentials: "include",
              body: JSON.stringify({
                movie_id: Number(movieId),
                rating: Number(rating),
                review
              })
            }
          );

          const data =
            await response.json();

          if (!response.ok) {

            message.textContent =
              data.error || "Unable to save review.";

            return;
          }

          message.textContent =
            "Review saved successfully.";

        } catch (error) {

          console.error(error);

          message.textContent =
            "Unable to connect to the server.";

        }

      });


    // =========================
    // LOAD ARTICLE
    // =========================

    const loadMessage =
      document.getElementById("load-message");

    document
      .getElementById("load-article-button")
      .addEventListener("click", async () => {

        const articleId =
          document.getElementById("article-id").value;

        if (!articleId) {

          loadMessage.textContent =
            "Enter an Article ID first.";

          return;
        }

        try {

          const response = await fetch(
            `/api/movies?type=news&id=${articleId}`,
            {
              credentials: "include"
            }
          );

          const data =
            await response.json();

          if (!response.ok) {

            loadMessage.textContent =
              data.error || "Unable to load article.";

            return;
          }

          document.getElementById("article-title").value =
            data.title || "";

          document.getElementById("article-slug").value =
            data.slug || "";

          document.getElementById("article-excerpt").value =
            data.excerpt || "";

          document.getElementById("article-author").value =
            data.author || "";

          document.getElementById("article-image").value =
            data.image_url || "";

          document.getElementById("article-content").value =
            data.content || "";

          document.getElementById("article-published").checked =
            data.published === true;

          loadMessage.textContent =
            "Article loaded.";

        } catch (error) {

          console.error(error);

          loadMessage.textContent =
            "Unable to connect to the server.";

        }

      });


    // =========================
    // SAVE ARTICLE
    // =========================

    document
      .getElementById("save-article-button")
      .addEventListener("click", async () => {

        const articleId =
          document.getElementById("article-id").value;

        const title =
          document.getElementById("article-title").value;

        const slug =
          document.getElementById("article-slug").value;

        const excerpt =
          document.getElementById("article-excerpt").value;

        const author =
          document.getElementById("article-author").value;

        const imageUrl =
          document.getElementById("article-image").value;

        const content =
          document.getElementById("article-content").value;

        const published =
          document.getElementById("article-published").checked;

        if (!title || !slug || !content) {

          newsMessage.textContent =
            "Title, slug and content are required.";

          return;
        }

        try {

          const response = await fetch(
            "/api/movies?type=news",
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json"
              },
              credentials: "include",
              body: JSON.stringify({
                id: articleId ? Number(articleId) : undefined,
                title,
                slug,
                excerpt,
                author,
                image_url: imageUrl,
                content,
                published
              })
            }
          );

          const data =
            await response.json();

          if (!response.ok) {

            newsMessage.textContent =
              data.error || "Unable to save article.";

            return;
          }

          newsMessage.textContent =
            "Article saved successfully. ID: " + data.id;

        } catch (error) {

          console.error(error);

          newsMessage.textContent =
            "Unable to connect to the server.";

        }

      });

  </script>

</body>
</html>

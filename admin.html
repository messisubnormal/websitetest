<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>News Article</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 15% 10%, rgba(37, 99, 235, 0.28), transparent 30%),
        radial-gradient(circle at 85% 25%, rgba(59, 130, 246, 0.18), transparent 30%),
        linear-gradient(135deg, #020617, #071b3a 50%, #06152d);
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* NAVIGATION (same as index.html) */

    nav {
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 50px;

      background: rgba(2, 6, 23, 0.72);
      border-bottom: 1px solid rgba(96, 165, 250, 0.18);

      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: 0.5px;
      white-space: nowrap;
      color: white;
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 24px;
      list-style: none;
    }

    .nav-links a {
      color: #dbeafe;
      text-decoration: none;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.15;
      text-align: center;
      white-space: nowrap;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: #60a5fa;
    }

    .nav-search {
      display: flex;
      align-items: center;
    }

    #search-form {
      display: flex;
      align-items: center;
      height: 34px;
    }

    #search-input {
      width: 120px;
      height: 34px;

      padding: 0 12px;

      border: 1px solid rgba(96, 165, 250, 0.3);
      border-right: none;
      border-radius: 7px 0 0 7px;

      background: rgba(15, 23, 42, 0.8);
      color: white;

      font-size: 12px;
      outline: none;
    }

    #search-input::placeholder {
      color: rgba(219, 234, 254, 0.55);
    }

    #search-input:focus {
      border-color: rgba(96, 165, 250, 0.7);
    }

    #search-form button {
      width: 36px;
      height: 34px;

      border: 1px solid rgba(96, 165, 250, 0.3);
      border-radius: 0 7px 7px 0;

      background: rgba(37, 99, 235, 0.35);
      color: white;

      font-size: 18px;
      cursor: pointer;
    }

    #search-form button:hover {
      background: rgba(37, 99, 235, 0.6);
    }

    .account-link {
      color: #dbeafe;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      margin-left: 28px;
    }

    .account-link:hover {
      color: #60a5fa;
    }

    .profile-nav-icon {
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      text-decoration: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .profile-nav-icon:hover {
      opacity: 0.8;
      transform: scale(1.05);
    }

    .profile-nav-icon svg {
      width: 30px;
      height: 30px;
      display: block;
    }

    @media (max-width: 800px) {
      nav {
        padding: 0 25px;
      }

      .nav-links {
        display: none;
      }
    }

    /* ARTICLE */

    main {
      max-width: 1150px;
      margin: auto;
      padding: 50px 25px 90px;
    }

    #back-link {
      display: inline-block;
      margin-bottom: 24px;
      color: #93c5fd;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }

    #back-link:hover {
      color: #60a5fa;
    }

    /* the sheet */

    #article-sheet {
      background: #f4f1ea;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);
    }

    #article-image {
      width: 100%;
      max-height: 420px;
      object-fit: cover;
      display: none;
    }

    #article-body {
      padding: 50px 60px 60px;
    }

    #article-title {
      font-family: Georgia, 'Times New Roman', Times, serif;
      font-size: 46px;
      font-weight: 700;
      letter-spacing: 0.2px;
      line-height: 1.2;
      margin-bottom: 18px;
      color: #0f0f0f;
    }

    #article-meta {
      font-family: Georgia, 'Times New Roman', Times, serif;
      font-size: 15px;
      font-weight: 600;
      font-style: italic;
      color: #8a7f5e;
      margin-bottom: 36px;
      padding-bottom: 30px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
    }

    #article-content {
      font-family: Georgia, 'Times New Roman', Times, serif;
      font-size: 21px;
      line-height: 1.8;
      color: #101010;
    }

    #article-content p {
      margin-bottom: 22px;
      text-indent: 2.2em;
    }

    #article-content p:first-child {
      text-indent: 0;
    }

    #status-message {
      font-size: 15px;
      color: rgba(219, 234, 254, 0.75);
    }

    @media (max-width: 600px) {
      #article-body {
        padding: 30px 25px 40px;
      }

      #article-title {
        font-size: 30px;
      }

      #article-content {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

  <nav>
    <a href="/index.html" class="logo">
      FIND YOUR NEXT FAVOURITE MOVIE
    </a>

    <ul class="nav-links">
      <li><a href="/top-rated.html">TOP RATED</a></li>

      <li>
        <a href="/recommendations.html">
          PERSONAL<br>
          RECOMMENDATIONS
        </a>
      </li>

      <li><a href="/news.html">NEWS</a></li>

      <li>
        <a href="/streaming.html">
          STREAMING<br>
          RECOMMENDATIONS
        </a>
      </li>

      <li><a href="#">FORUM</a></li>

      <li>
        <a href="#">
          HELP<br>
          IN PRODUCTION
        </a>
      </li>

      <li class="nav-search">
        <form id="search-form">
          <input
            type="search"
            id="search-input"
            placeholder="Search movies..."
            autocomplete="off"
          >
          <button type="submit">⌕</button>
        </form>
      </li>
    </ul>

    <div id="account-nav">
      <a href="/account.html" class="account-link">LOG IN</a>
    </div>
  </nav>

  <main>

    <a id="back-link" href="/news.html">← Back to News</a>

    <div id="status-message"></div>

    <div id="article-sheet">

      <img id="article-image" src="" alt="">

      <div id="article-body">

        <div id="article-title"></div>
        <div id="article-meta"></div>

        <div id="article-content"></div>

      </div>

    </div>

  </main>


  <script>

    function formatDate(dateString) {

      if (!dateString) {
        return "";
      }

      const date = new Date(dateString);

      return date.toLocaleDateString("en-US", {
        year: "numeric",
        month: "long",
        day: "numeric"
      });
    }


    async function loadArticle() {

      const params =
        new URLSearchParams(window.location.search);

      const slug =
        params.get("slug");

      const statusMessage =
        document.getElementById("status-message");

      if (!slug) {
        statusMessage.textContent =
          "No article specified.";
        return;
      }

      try {

        const response = await fetch(
          `/api/movies?type=news&slug=${encodeURIComponent(slug)}`
        );

        const data =
          await response.json();

        if (!response.ok) {
          statusMessage.textContent =
            data.error === "Article not found"
              ? "This article doesn't exist or isn't published."
              : "Unable to load article.";
          return;
        }

        document.title =
          data.title + " - News";

        document.getElementById("article-title").textContent =
          data.title;

        document.getElementById("article-meta").textContent =
          `${data.author || "Admin"} · ${formatDate(data.published_at)}`;

        const contentContainer =
          document.getElementById("article-content");

        contentContainer.innerHTML = "";

        const paragraphs = data.content
          .split(/\n\s*\n/)
          .map(p => p.trim())
          .filter(p => p.length > 0);

        for (const paragraphText of paragraphs) {

          const p = document.createElement("p");
          p.textContent = paragraphText;

          contentContainer.appendChild(p);
        }

        if (data.image_url) {
          const image =
            document.getElementById("article-image");

          image.src = data.image_url;
          image.alt = data.title;
          image.style.display = "block";
        }

      } catch (error) {

        console.error(error);

        statusMessage.textContent =
          "Unable to connect to the server.";

      }
    }

    loadArticle();


    // =========================
    // ACCOUNT NAV (same as index.html)
    // =========================

    async function updateAccountNav() {
      const accountNav = document.getElementById("account-nav");

      if (!accountNav) return;

      try {
        const response = await fetch("/api/current-user.js");

        if (!response.ok) {
          return;
        }

        const data = await response.json();

        if (!data.loggedIn) {
          return;
        }

        accountNav.innerHTML = `
          <a
            href="/account.html"
            class="profile-nav-icon"
            aria-label="My Profile"
            title="My Profile"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true"
            >
              <circle
                cx="12"
                cy="8"
                r="3.5"
                stroke="currentColor"
                stroke-width="1.8"
              />

              <path
                d="M5 20C5.8 16.6 8.2 14.5 12 14.5C15.8 14.5 18.2 16.6 19 20"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
              />
            </svg>
          </a>
        `;

      } catch (error) {
        console.error("Could not check account status:", error);
      }
    }

    updateAccountNav();


    // =========================
    // SEARCH (same as index.html)
    // =========================

    const searchForm = document.getElementById("search-form");
    const searchInput = document.getElementById("search-input");

    searchForm.addEventListener("submit", event => {
      event.preventDefault();

      const query = searchInput.value.trim();

      if (!query) {
        return;
      }

      window.location.href =
        `/search.html?query=${encodeURIComponent(query)}`;
    });

  </script>

</body>
</html>

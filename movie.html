<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Movie</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #07152f, #0b2a5c, #123d7a);
      color: white;
      min-height: 100vh;
    }

    header {
      padding: 25px 6%;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      color: white;
      text-decoration: none;
    }

    .movie-page {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 30px;
    }

    .movie-content {
      display: flex;
      gap: 45px;
      align-items: flex-start;
    }

    .movie-poster {
      width: 280px;
      aspect-ratio: 2 / 3;
      border-radius: 12px;
      overflow: hidden;
      flex-shrink: 0;
      background: #10264d;
    }

    .movie-poster img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .movie-info {
      flex: 1;
    }

    .movie-title {
      font-size: 42px;
      margin: 0 0 30px;
    }

    .movie-summary {
  max-width: 700px;
  margin: -15px 0 20px;
  line-height: 1.6;
  color: rgba(255,255,255,0.78);
  font-size: 16px;
}

.ratings-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 20px;
}

.rating-box {
  background: #244a7d;
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 12px;
  padding: 18px 24px;
  min-height: 60px;
  box-sizing: border-box;
}

.rating-label {
  font-size: 14px;
  margin-bottom: 6px;
  color: #cbd5e1;
}

.rating-number {
  font-size: 27px;
  font-weight: 700;
  color: white;
}

.your-rating {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 65px;
}

.your-rating .rating-label {
  margin: 0;
}

.stars {
  display: flex;
  align-items: center;
  gap: 0;
}

.stars button {
  background: none;
  border: none;
  padding: 0;
  width: 22px;
  height: 28px;
  font-size: 22px;
  color: #102a56;
  cursor: pointer;
  line-height: 28px;
}

.stars button:hover {
  transform: scale(1.1);
}

.stars button.active {
  color: #f5c542;
}
    .title-row {
  display: flex;
  align-items: baseline;
  gap: 14px;
}

.movie-runtime {
  font-size: 15px;
  font-weight: 500;
  color: rgba(255, 255, 255, 0.55);
  white-space: nowrap;
}

.movie-credits {
  margin-top: 0px;
  margin-bottom: 30px;
  font-size: 15px;
  line-height: 1.2;
  color: rgba(255, 255, 255, 0.7);
}

.movie-credits p {
  margin-bottom: 5px;
}

.movie-credits strong {
  color: #ffffff;
}

    .review {
  margin-top: 50px;
  background: #f1f0eb;
  color: #172033;
  border-radius: 14px;
  padding: 35px 40px;
  box-shadow: 0 12px 35px rgba(0, 0, 0, 0.22);
}

.review h2 {
  margin: 0 0 20px;
  font-size: 22px;
  color: #102a56;
  text-align: center;
}

.review p {
  margin: 35px 0 0;
  text-align: center;
  line-height: 1.8;
  color: #303846;
  font-size: 17px;
  font-style: italic;
}

.review p.has-review {
  margin: 35px 0 0;
  text-align: left;
  line-height: 1.8;
  color: #303846;
  font-size: 17px;
  font-family: "Times New Roman", Times, serif;
  font-style: normal;
  text-indent: 30px;
}

    .loading {
      text-align: center;
      margin-top: 100px;
      font-size: 20px;
    }

    @media (max-width: 700px) {
      .movie-content {
        flex-direction: column;
      }

      .movie-poster {
        width: 220px;
      }

      .movie-title {
        font-size: 32px;
      }
    }

    @media (max-width: 700px) {
  .ratings-grid {
    grid-template-columns: 1fr;
  }

  .your-rating {
    grid-column: auto;
  }
}
  </style>
</head>

<body>

  <header>
    <a href="index.html" class="logo">Find Your Next Favourite Movie</a>
  </header>

  <main class="movie-page">

    <div id="loading" class="loading">
      Loading movie...
    </div>

    <div id="movie-content" class="movie-content" style="display:none;">

      <div class="movie-poster">
        <img id="movie-poster" src="" alt="">
      </div>

      <div class="movie-info">

      <div class="title-row">
  <h1 id="movie-title" class="movie-title"></h1>
  <span id="movie-runtime" class="movie-runtime"></span>
</div>

<p id="movie-summary" class="movie-summary"></p>

<div class="movie-credits">
  <p>
    <strong>Director:</strong>
    <span id="movie-director">—</span>
  </p>

  <p>
    <strong>Writers:</strong>
    <span id="movie-writers">—</span>
  </p>
</div>

<div class="ratings-grid">

  <div class="rating-box">
    <div class="rating-label">Website Rating</div>
    <div id="website-rating" class="rating-number">—</div>
  </div>

  <div class="rating-box">
    <div class="rating-label">User Rating</div>
    <div id="user-rating" class="rating-number">—</div>
  </div>

  <div class="rating-box your-rating">
    <div class="rating-label">Your Rating</div>

    <div id="your-rating-stars" class="stars">
      <button type="button" data-rating="1">☆</button>
      <button type="button" data-rating="2">☆</button>
      <button type="button" data-rating="3">☆</button>
      <button type="button" data-rating="4">☆</button>
      <button type="button" data-rating="5">☆</button>
      <button type="button" data-rating="6">☆</button>
      <button type="button" data-rating="7">☆</button>
      <button type="button" data-rating="8">☆</button>
      <button type="button" data-rating="9">☆</button>
      <button type="button" data-rating="10">☆</button>
    </div>
  </div>

</div>

        </div>

      </div>

    </div>
    
    <div class="review">
          <h2>Review</h2>

          <p id="movie-review">
            Our review will be available shortly
          </p>
     </div>
    

  </main>

<script>

  async function loadMovie() {

    const params = new URLSearchParams(window.location.search);
    const movieId = params.get("id");

    if (!movieId) {
      document.getElementById("loading").textContent =
        "Movie not found.";
      return;
    }

    try {

      // =========================
      // LOAD MOVIE FROM TMDB
      // =========================

      const response = await fetch(
        `/api/movies?id=${movieId}`
      );

      if (!response.ok) {
        throw new Error("Movie request failed");
      }

      const movie = await response.json();

      document.title =
        `${movie.title} — Find Your Next Favourite Movie`;

      document.getElementById("movie-title").textContent =
        `${movie.title} (${movie.release_date ? movie.release_date.substring(0, 4) : ""})`;

      document.getElementById("movie-summary").textContent =
        movie.overview || "";

      document.getElementById("movie-poster").src =
        `https://image.tmdb.org/t/p/w500${movie.poster_path}`;

      document.getElementById("movie-poster").alt =
        movie.title;


      // =========================
      // RUNTIME
      // =========================

      if (movie.runtime) {

        const hours = Math.floor(movie.runtime / 60);
        const minutes = movie.runtime % 60;

        let runtimeText = "";

        if (hours > 0) {
          runtimeText += `${hours}h`;
        }

        if (minutes > 0) {
          runtimeText += ` ${minutes}min`;
        }

        document.getElementById("movie-runtime").textContent =
          runtimeText.trim();
      }


      // =========================
      // DIRECTOR
      // =========================

      const director = movie.credits?.crew?.find(
        person => person.job === "Director"
      );

      document.getElementById("movie-director").textContent =
        director ? director.name : "—";


      // =========================
      // WRITERS
      // =========================

      const writers = movie.credits?.crew
        ?.filter(person =>
          person.department === "Writing" ||
          person.job === "Writer" ||
          person.job === "Screenplay"
        )
        .map(person => person.name)
        .filter((name, index, array) =>
          array.indexOf(name) === index
        );

      document.getElementById("movie-writers").textContent =
        writers && writers.length
          ? writers.join(", ")
          : "—";


      // =========================
      // DEFAULT WEBSITE RATING
      // =========================

      document.getElementById("website-rating").textContent =
        movie.vote_average
          ? `${movie.vote_average.toFixed(1)} (Provisional)`
          : "—";

      document.getElementById("user-rating").textContent =
        "—";


      // =========================
      // LOAD OUR REVIEW
      // =========================

      try {

        const reviewResponse = await fetch(
          `/api/reviews?id=${movieId}`
        );

        console.log(
          "Review API status:",
          reviewResponse.status
        );

        if (reviewResponse.ok) {

          const reviewData =
            await reviewResponse.json();

          console.log(
            "Review data:",
            reviewData
          );

          // Replace provisional TMDB rating
          // with our actual website rating

          if (reviewData.rating !== null) {
            document.getElementById("website-rating").textContent =
              reviewData.rating;
          }

          // Replace placeholder review

if (reviewData.review) {
  const reviewElement =
    document.getElementById("movie-review");

  reviewElement.innerHTML = "";

  const paragraphs = reviewData.review
    .split(/\n\s*\n/)
    .map(paragraph => paragraph.trim())
    .filter(paragraph => paragraph.length > 0);

  paragraphs.forEach(paragraph => {
    const p = document.createElement("p");

    p.className = "has-review";
    p.textContent = paragraph;

    reviewElement.appendChild(p);
  });
}

        }

      } catch (reviewError) {

        console.error(
          "Review loading failed:",
          reviewError
        );

        // Keep the provisional TMDB rating.
        // The movie page itself still works.

      }


      // =========================
      // SHOW PAGE
      // =========================

      document.getElementById("loading").style.display =
        "none";

      document.getElementById("movie-content").style.display =
        "flex";


    } catch (error) {

      console.error(error);

      document.getElementById("loading").textContent =
        "Unable to load this movie.";

    }

  }


  loadMovie();
  
const starsContainer = document.getElementById("your-rating-stars");
const userRatingElement = document.getElementById("user-rating");

async function loadUserRating() {
  try {
    const response = await fetch(
      `/api/user-rating.js?movie_id=${movieId}`
    );

    const data = await response.json();

    if (!response.ok || !data.success) {
      console.error("Could not load user rating:", data);
      return;
    }

    // Show the average user rating
    if (data.averageRating !== null) {
      userRatingElement.textContent =
        `${data.averageRating.toFixed(1)} (${data.ratingCount})`;
    } else {
      userRatingElement.textContent = "—";
    }

    // Highlight the logged-in user's rating
    if (data.userRating !== null) {
      highlightStars(data.userRating);
    }

    // If not logged in, disable the stars
    if (!data.loggedIn) {
      starsContainer.querySelectorAll("button").forEach(button => {
        button.disabled = true;
        button.title = "Log in to rate this movie";
      });
    }

  } catch (error) {
    console.error("Error loading user rating:", error);
  }
}

function highlightStars(rating) {
  starsContainer.querySelectorAll("button").forEach(button => {
    const buttonRating = Number(button.dataset.rating);

    button.textContent =
      buttonRating <= rating ? "★" : "☆";

    button.classList.toggle(
      "active",
      buttonRating <= rating
    );
  });
}

starsContainer.querySelectorAll("button").forEach(button => {
  button.addEventListener("click", async () => {

    const rating = Number(button.dataset.rating);

    try {
      const response = await fetch("/api/user-rating.js", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          movie_id: movieId,
          rating: rating
        })
      });

      const data = await response.json();

      if (!response.ok) {
        alert(data.error || "Could not save rating.");
        return;
      }

      highlightStars(rating);

      // Reload the average so the Users Rating updates immediately
      await loadUserRating();

    } catch (error) {
      console.error("Error saving rating:", error);
      alert("Could not save your rating.");
    }
  });
});

loadUserRating();

</script>

</body>
</html>

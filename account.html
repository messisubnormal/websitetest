<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #0f172a;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .account-box {
      width: 90%;
      max-width: 420px;
      background: #f1f0eb;
      color: #172033;
      padding: 35px;
      border-radius: 14px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.25);

      transition: max-width 0.2s ease;
    }

    .account-box.profile-active {
      max-width: 900px;
    }

    h1 {
      text-align: center;
      color: #102a56;
      margin-top: 0;
    }

    .tabs {
      display: flex;
      margin-bottom: 25px;
    }

    .tabs button {
      flex: 1;
      padding: 12px;
      border: none;
      cursor: pointer;
      background: #ddd;
      font-size: 16px;
    }

    .tabs button.active {
      background: #102a56;
      color: white;
    }

    form {
      display: none;
    }

    form.active {
      display: block;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #bbb;
      border-radius: 6px;
      font-size: 16px;
    }

    .submit-button {
      width: 100%;
      margin-top: 25px;
      padding: 13px;
      border: none;
      border-radius: 6px;
      background: #102a56;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .submit-button:hover {
      opacity: 0.9;
    }

    #message {
      margin-top: 20px;
      text-align: center;
      font-weight: bold;
    }

    .back {
      display: block;
      margin-top: 20px;
      text-align: center;
      color: #102a56;
      text-decoration: none;
    }

    .profile-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 25px;
}

.profile-home-link {
  color: #102a56;
  text-decoration: none;
  font-weight: bold;
}

.profile-home-link:hover {
  text-decoration: underline;
}

.profile-logout-button {
  border: none;
  background: transparent;
  color: #102a56;
  font-weight: bold;
  cursor: pointer;
  padding: 6px 0;
  font-size: 14px;
}

.profile-logout-button:hover {
  text-decoration: underline;
}
    .profile-icon {
  width: 90px;
  height: 90px;
  margin: 0 auto 18px;
  border-radius: 50%;
  background: #dbeafe;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 45px;
}

.profile-username {
  margin-bottom: 8px;
}

.profile-email {
  margin-bottom: 30px;
  color: #64748b;
  text-align: center;
}

.profile-section {
  margin-top: 35px;
}

.profile-section h2 {
  color: #102a56;
  margin-bottom: 15px;
  font-size: 22px;
}

.profile-movie-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: 16px;
}

.profile-movie-card {
  cursor: pointer;
  overflow: hidden;
}

.profile-movie-poster {
  width: 100%;
  aspect-ratio: 2 / 3;
  object-fit: cover;
  display: block;
  border-radius: 8px;
}

.profile-movie-title {
  margin-top: 7px;
  font-size: 13px;
  font-weight: bold;
  color: #172033;
  line-height: 1.2;
}

.profile-movie-rating {
  margin-top: 4px;
  font-size: 13px;
  color: #102a56;
  font-weight: bold;
}

.show-more-button {
  display: block;
  margin: 18px auto 0;
  padding: 9px 20px;
  border: none;
  border-radius: 6px;
  background: #102a56;
  color: white;
  cursor: pointer;
  font-size: 14px;
}

.show-more-button:hover {
  opacity: 0.9;
}

.empty-profile-section {
  color: #64748b;
  text-align: center;
  margin: 20px 0;
}
  </style>
</head>

<body>

<div id="google_translate_element" style="display: none;"></div>

<script>

  /* LANGUAGE (read-only on this page — switcher lives in the site nav) */

  function getSiteLanguage() {
    const match = document.cookie.match(/googtrans=\/en\/([a-zA-Z-]+)/);

    if (!match) {
      return "en";
    }

    const code = match[1].toLowerCase();

    if (code === "es") {
      return "es";
    }

    if (code === "zh-cn") {
      return "zh";
    }

    return "en";
  }

  function googleTranslateElementInit() {
    new google.translate.TranslateElement(
      {
        pageLanguage: "en",
        includedLanguages: "es,zh-CN",
        autoDisplay: false
      },
      "google_translate_element"
    );
  }
</script>
<script
  src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"
></script>

  <div class="account-box">

  <div id="profile-view" style="display: none;">
</div>

    <h1>Account</h1>

    <div class="tabs">
      <button id="login-tab" class="active">Log In</button>
      <button id="register-tab">Create Account</button>
    </div>

    <form id="login-form" class="active">
      <label for="login-email">Email</label>
      <input
        id="login-email"
        type="email"
        required
      >

      <label for="login-password">Password</label>
      <input
        id="login-password"
        type="password"
        required
      >

      <button class="submit-button" type="submit">
        Log In
      </button>
    </form>

    <form id="register-form">

      <label for="register-username">Username</label>
      <input
        id="register-username"
        type="text"
        minlength="3"
        required
      >

      <label for="register-email">Email</label>
      <input
        id="register-email"
        type="email"
        required
      >

      <label for="register-password">Password</label>
      <input
        id="register-password"
        type="password"
        minlength="8"
        required
      >

      <button class="submit-button" type="submit">
        Create Account
      </button>

    </form>

    <div id="message"></div>

  </div>

  <script>
    async function checkLoggedInUser() {
  try {
    const response = await fetch("/api/current-user.js");

    if (!response.ok) return;

    const data = await response.json();

    if (!data.loggedIn) return;

    const profileView = document.getElementById("profile-view");

    profileView.style.display = "block";

    document.querySelector(".account-box").classList.add("profile-active");

    document.querySelector(".account-box h1").style.display = "none";
    document.querySelector(".tabs").style.display = "none";
    document.getElementById("login-form").style.display = "none";
    document.getElementById("register-form").style.display = "none";
    document.getElementById("message").style.display = "none";

    profileView.innerHTML = `
  <div class="profile">

    <div class="profile-header">

      <a
        href="/"
        class="profile-home-link"
      >
        ← Home
      </a>

      <button
        id="logout-button"
        class="profile-logout-button"
        type="button"
      >
        Log Out
      </button>

    </div>

    <div class="profile-icon">
      👤
    </div>

    <h1 class="profile-username">
      ${data.user.username}
    </h1>

    <p class="profile-email">
      ${data.user.email}
    </p>

    <!-- WISHLIST -->

    <section class="profile-section">

      <h2>My Wishlist</h2>

      <div id="wishlist-grid" class="profile-movie-grid"></div>

      <button
        id="wishlist-more"
        class="show-more-button"
        type="button"
        style="display: none;"
      >
        Show More
      </button>

    </section>

    <!-- RATINGS -->

    <section class="profile-section">

      <h2>My Ratings</h2>

      <div id="ratings-grid" class="profile-movie-grid"></div>

      <button
        id="ratings-more"
        class="show-more-button"
        type="button"
        style="display: none;"
      >
        Show More
      </button>

    </section>

  </div>
`;
    const logoutButton =
  document.getElementById("logout-button");

logoutButton.addEventListener("click", async () => {

  try {

    const response =
      await fetch("/api/current-user.js", {
  method: "POST"
})

    if (!response.ok) {
      throw new Error("Logout failed");
    }

    window.location.href = "/";

  } catch (error) {

    console.error("Logout error:", error);

    alert("Could not log out. Please try again.");
  }
});

const wishlistGrid =
  document.getElementById("wishlist-grid");

const wishlistMore =
  document.getElementById("wishlist-more");

const ratingsGrid =
  document.getElementById("ratings-grid");

const ratingsMore =
  document.getElementById("ratings-more");


// ========================================
// LOAD MOVIE INFORMATION
// ========================================

async function getMovie(movieId) {
  const response = await fetch(
    `/api/movies.js?id=${movieId}&lang=${getSiteLanguage()}`
  );

  if (!response.ok) {
    throw new Error(`Could not load movie ${movieId}`);
  }

  return await response.json();
}


// ========================================
// CREATE MOVIE CARD
// ========================================

function createMovieCard(movie, rating = null) {

  const card = document.createElement("div");

  card.className = "profile-movie-card";

  const poster = movie.poster_path
    ? `https://image.tmdb.org/t/p/w500${movie.poster_path}`
    : "";

  card.innerHTML = `
    <img
      src="${poster}"
      alt="${movie.title}"
      class="profile-movie-poster"
    >

    <div class="profile-movie-title">
      ${movie.title}
    </div>

    ${
      rating !== null
        ? `<div class="profile-movie-rating">
             ★ ${rating}/10
           </div>`
        : ""
    }
  `;

  card.addEventListener("click", () => {
    window.location.href =
      `/movie.html?id=${movie.id}`;
  });

  return card;
}


// ========================================
// SHOW FIRST 3 + SHOW MORE
// ========================================

function setupShowMore(
  grid,
  button,
  cards
) {

  let expanded = false;

  function render() {

    grid.innerHTML = "";

    const visibleCards =
      expanded
        ? cards
        : cards.slice(0, 6);

    visibleCards.forEach(card => {
      grid.appendChild(card);
    });

    if (cards.length > 6) {

      button.style.display = "block";

      button.textContent =
        expanded
          ? "Show Less"
          : "Show More";

    } else {

      button.style.display = "none";
    }
  }

  button.addEventListener("click", () => {

    expanded = !expanded;

    render();
  });

  render();
}


// ========================================
// LOAD WISHLIST
// ========================================

async function loadWishlistSection() {

try {

  const response =
    await fetch("/api/wishlist.js");

  if (!response.ok) {
    throw new Error("Could not load wishlist.");
  }

  const wishlistData =
    await response.json();

  if (
    !wishlistData.movies ||
    wishlistData.movies.length === 0
  ) {

    wishlistGrid.innerHTML =
      `<p class="empty-profile-section">
        Your wishlist is empty.
      </p>`;

  } else {

    const wishlistCards = (
      await Promise.all(
        wishlistData.movies.map(async item => {

          try {

            const movie =
              await getMovie(item.movie_id);

            return createMovieCard(movie);

          } catch (error) {

            console.error(
              "Could not load wishlist movie:",
              item.movie_id,
              error
            );

            return null;
          }
        })
      )
    ).filter(card => card !== null);

    setupShowMore(
      wishlistGrid,
      wishlistMore,
      wishlistCards
    );
  }

} catch (error) {

  console.error(
    "Wishlist loading error:",
    error
  );

  wishlistGrid.innerHTML =
    `<p class="empty-profile-section">
      Could not load your wishlist.
    </p>`;
}

}


// ========================================
// LOAD RATINGS
// ========================================

async function loadRatingsSection() {

try {

  const response =
    await fetch("/api/user-rating.js");

  if (!response.ok) {
    throw new Error("Could not load ratings.");
  }

  const ratingData =
    await response.json();

  if (
    !ratingData.ratings ||
    ratingData.ratings.length === 0
  ) {

    ratingsGrid.innerHTML =
      `<p class="empty-profile-section">
        You haven't rated any movies yet.
      </p>`;

  } else {

    const ratingCards = (
      await Promise.all(
        ratingData.ratings.map(async item => {

          try {

            const movie =
              await getMovie(item.movie_id);

            return createMovieCard(
              movie,
              item.rating
            );

          } catch (error) {

            console.error(
              "Could not load rated movie:",
              item.movie_id,
              error
            );

            return null;
          }
        })
      )
    ).filter(card => card !== null);

    setupShowMore(
      ratingsGrid,
      ratingsMore,
      ratingCards
    );
  }

} catch (error) {

  console.error(
    "Ratings loading error:",
    error
  );

  ratingsGrid.innerHTML =
    `<p class="empty-profile-section">
      Could not load your ratings.
    </p>`;
}

}


/*
 * Load wishlist and ratings at the same time
 * instead of one after the other.
 */

await Promise.all([
  loadWishlistSection(),
  loadRatingsSection()
]);

  } catch (error) {
    console.error("Could not check login:", error);
  }
}

checkLoggedInUser();
    const loginTab = document.getElementById("login-tab");
    const registerTab = document.getElementById("register-tab");

    const loginForm = document.getElementById("login-form");
    const registerForm = document.getElementById("register-form");

    const message = document.getElementById("message");

    loginTab.addEventListener("click", () => {
      loginTab.classList.add("active");
      registerTab.classList.remove("active");

      loginForm.classList.add("active");
      registerForm.classList.remove("active");

      message.textContent = "";
    });

    registerTab.addEventListener("click", () => {
      registerTab.classList.add("active");
      loginTab.classList.remove("active");

      registerForm.classList.add("active");
      loginForm.classList.remove("active");

      message.textContent = "";
    });

    registerForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      message.textContent = "Creating account...";

      const username =
        document.getElementById("register-username").value;

      const email =
        document.getElementById("register-email").value;

      const password =
        document.getElementById("register-password").value;

      try {
        const response = await fetch("/api/register.js", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            username,
            email,
            password
          })
        });

        const data = await response.json();

        if (!response.ok) {
          message.textContent =
            data.error || "Could not create account.";

          return;
        }

        message.textContent =
          "Account created! You can now log in.";

        registerForm.reset();

        loginTab.click();

      } catch (error) {
        console.error(error);

        message.textContent =
          "Something went wrong. Please try again.";
      }
    });

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      message.textContent = "Logging in...";

      const email =
        document.getElementById("login-email").value;

      const password =
        document.getElementById("login-password").value;

      try {
        const response = await fetch("/api/login.js", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            email,
            password
          })
        });

        const data = await response.json();

        if (!response.ok) {
          message.textContent =
            data.error || "Could not log in.";

          return;
        }

       message.innerHTML = `
  <div style="font-size: 20px; margin-bottom: 20px;">
    Welcome, ${data.user.username}!
  </div>

  <a
    href="index.html"
    class="submit-button"
    style="
      display: block;
      box-sizing: border-box;
      text-align: center;
      text-decoration: none;
    "
  >
    Go to Homepage
  </a>
`;

loginForm.style.display = "none";
registerForm.style.display = "none";

loginTab.style.display = "none";
registerTab.style.display = "none";

      } catch (error) {
        console.error(error);

        message.textContent =
          "Something went wrong. Please try again.";
      }
    });
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #0f172a;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .account-box {
      width: 90%;
      max-width: 420px;
      background: #f1f0eb;
      color: #172033;
      padding: 35px;
      border-radius: 14px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.25);
    }

    h1 {
      text-align: center;
      color: #102a56;
      margin-top: 0;
    }

    .tabs {
      display: flex;
      margin-bottom: 25px;
    }

    .tabs button {
      flex: 1;
      padding: 12px;
      border: none;
      cursor: pointer;
      background: #ddd;
      font-size: 16px;
    }

    .tabs button.active {
      background: #102a56;
      color: white;
    }

    form {
      display: none;
    }

    form.active {
      display: block;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #bbb;
      border-radius: 6px;
      font-size: 16px;
    }

    .submit-button {
      width: 100%;
      margin-top: 25px;
      padding: 13px;
      border: none;
      border-radius: 6px;
      background: #102a56;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .submit-button:hover {
      opacity: 0.9;
    }

    #message {
      margin-top: 20px;
      text-align: center;
      font-weight: bold;
    }

    .back {
      display: block;
      margin-top: 20px;
      text-align: center;
      color: #102a56;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="account-box">

  <div id="profile-view" style="display: none;">
</div>

    <h1>Account</h1>

    <div class="tabs">
      <button id="login-tab" class="active">Log In</button>
      <button id="register-tab">Create Account</button>
    </div>

    <form id="login-form" class="active">
      <label for="login-email">Email</label>
      <input
        id="login-email"
        type="email"
        required
      >

      <label for="login-password">Password</label>
      <input
        id="login-password"
        type="password"
        required
      >

      <button class="submit-button" type="submit">
        Log In
      </button>
    </form>

    <form id="register-form">

      <label for="register-username">Username</label>
      <input
        id="register-username"
        type="text"
        minlength="3"
        required
      >

      <label for="register-email">Email</label>
      <input
        id="register-email"
        type="email"
        required
      >

      <label for="register-password">Password</label>
      <input
        id="register-password"
        type="password"
        minlength="8"
        required
      >

      <button class="submit-button" type="submit">
        Create Account
      </button>

    </form>

    <div id="message"></div>

  </div>

  <script>
    async function checkLoggedInUser() {
  try {
    const response = await fetch("/api/current-user.js");

    if (!response.ok) return;

    const data = await response.json();

    if (!data.loggedIn) return;

    const profileView = document.getElementById("profile-view");

    profileView.style.display = "block";

    document.querySelector(".account-box h1").style.display = "none";
    document.querySelector(".tabs").style.display = "none";
    document.getElementById("login-form").style.display = "none";
    document.getElementById("register-form").style.display = "none";
    document.getElementById("message").style.display = "none";

    profileView.innerHTML = `
  <div style="text-align: center;">

    <div style="
      width: 90px;
      height: 90px;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: #dbeafe;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 45px;
    ">
      👤
    </div>

    <h1 style="margin-bottom: 8px;">
      ${data.user.username}
    </h1>

    <p style="
      margin-bottom: 30px;
      color: #64748b;
    ">
      ${data.user.email}
    </p>

    <div id="wishlist-section" style="
      margin-top: 30px;
      text-align: left;
    ">

      <h2 style="
        color: #102a56;
        margin-bottom: 15px;
      ">
        My Wishlist
      </h2>

      <div id="wishlist-grid" style="
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
      ">
        Loading wishlist...
      </div>

    </div>

  </div>
`;
    const wishlistGrid = document.getElementById("wishlist-grid");

try {
  const response = await fetch("/api/wishlist.js");

  if (response.status === 401) {
    wishlistGrid.textContent = "Please log in.";
    return;
  }

  if (!response.ok) {
    throw new Error("Could not load wishlist.");
  }

  const wishlistData = await response.json();

  if (!wishlistData.movies || wishlistData.movies.length === 0) {
    wishlistGrid.textContent = "Your wishlist is empty.";
  } else {
    wishlistGrid.innerHTML = "";

    wishlistData.movies.forEach(movie => {
      const card = document.createElement("div");

      card.style.cursor = "pointer";
      card.style.background = "#e5e7eb";
      card.style.borderRadius = "8px";
      card.style.padding = "10px";
      card.style.textAlign = "center";

      card.innerHTML = `
        <div style="
          aspect-ratio: 2 / 3;
          display: flex;
          align-items: center;
          justify-content: center;
          color: #64748b;
          font-size: 12px;
        ">
          Movie ${movie.movie_id}
        </div>
      `;

      card.addEventListener("click", () => {
        window.location.href =
          `/movie.html?id=${movie.movie_id}`;
      });

      wishlistGrid.appendChild(card);
    });
  }

} catch (error) {
  console.error("Wishlist loading error:", error);

  wishlistGrid.textContent =
    "Could not load your wishlist.";
}

  } catch (error) {
    console.error("Could not check login:", error);
  }
}

checkLoggedInUser();
    const loginTab = document.getElementById("login-tab");
    const registerTab = document.getElementById("register-tab");

    const loginForm = document.getElementById("login-form");
    const registerForm = document.getElementById("register-form");

    const message = document.getElementById("message");

    loginTab.addEventListener("click", () => {
      loginTab.classList.add("active");
      registerTab.classList.remove("active");

      loginForm.classList.add("active");
      registerForm.classList.remove("active");

      message.textContent = "";
    });

    registerTab.addEventListener("click", () => {
      registerTab.classList.add("active");
      loginTab.classList.remove("active");

      registerForm.classList.add("active");
      loginForm.classList.remove("active");

      message.textContent = "";
    });

    registerForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      message.textContent = "Creating account...";

      const username =
        document.getElementById("register-username").value;

      const email =
        document.getElementById("register-email").value;

      const password =
        document.getElementById("register-password").value;

      try {
        const response = await fetch("/api/register.js", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            username,
            email,
            password
          })
        });

        const data = await response.json();

        if (!response.ok) {
          message.textContent =
            data.error || "Could not create account.";

          return;
        }

        message.textContent =
          "Account created! You can now log in.";

        registerForm.reset();

        loginTab.click();

      } catch (error) {
        console.error(error);

        message.textContent =
          "Something went wrong. Please try again.";
      }
    });

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      message.textContent = "Logging in...";

      const email =
        document.getElementById("login-email").value;

      const password =
        document.getElementById("login-password").value;

      try {
        const response = await fetch("/api/login.js", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            email,
            password
          })
        });

        const data = await response.json();

        if (!response.ok) {
          message.textContent =
            data.error || "Could not log in.";

          return;
        }

       message.innerHTML = `
  <div style="font-size: 20px; margin-bottom: 20px;">
    Welcome, ${data.user.username}!
  </div>

  <a
    href="index.html"
    class="submit-button"
    style="
      display: block;
      box-sizing: border-box;
      text-align: center;
      text-decoration: none;
    "
  >
    Go to Homepage
  </a>
`;

loginForm.style.display = "none";
registerForm.style.display = "none";

loginTab.style.display = "none";
registerTab.style.display = "none";

      } catch (error) {
        console.error(error);

        message.textContent =
          "Something went wrong. Please try again.";
      }
    });
  </script>

</body>
</html>

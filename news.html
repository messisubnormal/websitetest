<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Movie News | Find Your Next Favorite Movie</title>

  <meta name="description" content="The latest movie news, announcements, and articles.">

  <meta property="og:title" content="Movie News | Find Your Next Favorite Movie">
  <meta property="og:description" content="The latest movie news, announcements, and articles.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://find-your-next-favorite-movie.vercel.app/news.html">
  <meta property="og:site_name" content="Find Your Next Favorite Movie">
  <meta property="og:image" content="https://find-your-next-favorite-movie.vercel.app/og-image.png">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Movie News | Find Your Next Favorite Movie">
  <meta name="twitter:description" content="The latest movie news, announcements, and articles.">
  <meta name="twitter:image" content="https://find-your-next-favorite-movie.vercel.app/og-image.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;

      background:
        radial-gradient(
          circle at 15% 10%,
          rgba(37, 99, 235, 0.28),
          transparent 30%
        ),
        radial-gradient(
          circle at 85% 25%,
          rgba(59, 130, 246, 0.18),
          transparent 30%
        ),
        linear-gradient(
          135deg,
          #020617,
          #071b3a 50%,
          #06152d
        );

      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* NAVIGATION */

    nav {
      min-height: 76px;
      flex-wrap: wrap;
      row-gap: 8px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 12px 50px;

      background: rgba(2, 6, 23, 0.72);
      border-bottom: 1px solid rgba(96, 165, 250, 0.18);

      backdrop-filter: blur(12px);

      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
  flex-shrink: 0;
      position: relative;
      display: inline-block;
      font-size: 19px;
      font-weight: 700;
      letter-spacing: 0.5px;
      white-space: nowrap;

      color: white;
      text-decoration: none;

      transition: transform 0.3s ease, text-shadow 0.3s ease;
    }

    .logo:hover {
      transform: translateY(-1px);
      text-shadow: 0 8px 14px rgba(0, 0, 0, 0.8);
    }

    .logo-shine {
      position: relative;
      display: inline-block;
      overflow: hidden;
    }

    .logo-shine::after {
      content: "";
      position: absolute;
      top: 0;
      left: -40%;
      width: 22%;
      height: 100%;

      background: linear-gradient(
        100deg,
        transparent 0%,
        rgba(255, 255, 255, 0.18) 45%,
        rgba(255, 255, 255, 0.3) 50%,
        rgba(255, 255, 255, 0.18) 55%,
        transparent 100%
      );

      pointer-events: none;
    }

    .logo:hover .logo-shine::after {
      left: 120%;
      transition: left 0.9s ease;
    }

    .logo-shine::after {
      transition: left 0s;
    }

    .nav-links {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 24px;

      list-style: none;
    }

    .nav-links a {
      color: #dbeafe;
      text-decoration: none;

      font-size: 12px;
      font-weight: 600;
      line-height: 1.15;

      text-align: center;
      white-space: nowrap;

      display: flex;
      align-items: center;
      justify-content: center;

      min-height: 40px;

      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: #60a5fa;
    }

    /* SEARCH */

    .nav-search {
      display: flex;
      align-items: center;
    }

    #search-form {
      display: flex;
      align-items: center;
      height: 34px;
    }

    #search-input {
      width: 120px;
      height: 34px;

      padding: 0 12px;

      border: 1px solid rgba(96, 165, 250, 0.3);
      border-right: none;

      border-radius: 7px 0 0 7px;

      background: rgba(15, 23, 42, 0.8);
      color: white;

      font-size: 12px;

      outline: none;
    }

    #search-input::placeholder {
      color: rgba(219, 234, 254, 0.55);
    }

    #search-input:focus {
      border-color: rgba(96, 165, 250, 0.7);
    }

    #search-form button {
      width: 36px;
      height: 34px;

      border: 1px solid rgba(96, 165, 250, 0.3);

      border-radius: 0 7px 7px 0;

      background: rgba(37, 99, 235, 0.35);

      color: white;

      font-size: 18px;

      cursor: pointer;
    }

    #search-form button:hover {
      background: rgba(37, 99, 235, 0.6);
    }

    .account-link {
      color: #dbeafe;
      text-decoration: none;

      font-size: 13px;
      font-weight: 600;

      white-space: nowrap;

      margin-left: 28px;
    }

    .account-link:hover {
      color: #60a5fa;
    }

.lang-switcher {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
  margin-left: 22px;
  padding-left: 22px;
  border-left: 1px solid rgba(96, 165, 250, 0.2);
}

#account-nav {
  flex-shrink: 0;
}

.lang-switcher button {
  background: none;
  border: none;
  padding: 4px 6px;
  color: rgba(219, 234, 254, 0.55);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  border-radius: 4px;
}

.lang-switcher button:hover {
  color: #dbeafe;
}

.lang-switcher button.active {
  color: #60a5fa;
  background: rgba(37, 99, 235, 0.18);
}

    .profile-nav-icon {
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      text-decoration: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .profile-nav-icon:hover {
      opacity: 0.8;
      transform: scale(1.05);
    }

    .profile-nav-icon svg {
      width: 30px;
      height: 30px;
      display: block;
    }

    /* MAIN */

    main {
      max-width: 900px;
      margin: auto;
      padding: 45px 50px 90px;
    }

    .page-title {
      font-size: 30px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .page-description {
      color: #93c5fd;
      font-size: 14px;
      margin-bottom: 40px;
    }

    /* NEWS LIST */

    #news-list {
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .article-card {
      display: flex;
      gap: 22px;

      padding: 20px;

      background: rgba(23, 45, 80, 0.55);
      border: 1px solid rgba(96, 165, 250, 0.18);
      border-radius: 12px;

      cursor: pointer;
      text-decoration: none;
      color: inherit;

      transition:
        transform 0.25s ease,
        box-shadow 0.25s ease,
        border-color 0.25s ease;
    }

    .article-card:hover {
      transform: translateY(-3px);
      border-color: rgba(96, 165, 250, 0.45);
      box-shadow: 0 12px 30px rgba(37, 99, 235, 0.25);
    }

    .article-card img {
      width: 220px;
      height: 140px;
      flex-shrink: 0;

      object-fit: cover;
      border-radius: 8px;

      background:
        linear-gradient(145deg, #172554, #0f172a);
    }

    .article-card-content {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .article-card-content h2 {
      margin: 0 0 8px 0;
      font-size: 20px;
      font-weight: 700;
      color: #f8fafc;
    }

    .article-card-content .meta {
      font-size: 13px;
      color: #93c5fd;
      margin-bottom: 10px;
    }

    .article-card-content .excerpt {
      font-size: 15px;
      color: #dbeafe;
      line-height: 1.5;
    }

    #empty-message,
    #error-message {
      color: #93c5fd;
      font-size: 15px;
    }

    /* MOBILE */

    @media (max-width: 800px) {

      nav {
        padding: 12px 25px;
      }

      .nav-links {
        display: none;
      }

      main {
        padding: 35px 25px 70px;
      }
    }

    @media (max-width: 600px) {

      .article-card {
        flex-direction: column;
      }

      .article-card img {
        width: 100%;
        height: 180px;
      }
    }

    @media (max-width: 500px) {

      .logo {
        font-size: 17px;
      }

      main {
        padding: 30px 16px 60px;
      }

      .page-title {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <nav>

    <a href="/index.html" class="logo">
      <span class="logo-shine">FIND YOUR NEXT FAVORITE MOVIE</span>
    </a>

    <ul class="nav-links">

      <li>
        <a href="/top-rated.html">
          TOP RATED
        </a>
      </li>

      <li>
        <a href="/recommendations.html">
          PERSONAL<br>
          RECOMMENDATIONS
        </a>
      </li>

      <li>
        <a href="/news.html">
          NEWS
        </a>
      </li>

      <li>
        <a href="/streaming.html">
          STREAMING<br>
          RECOMMENDATIONS
        </a>
      </li>

      <li class="nav-search">

        <form id="search-form">

          <input
            type="search"
            id="search-input"
            placeholder="Search movies..."
            autocomplete="off"
          >

          <button type="submit">
            ⌕
          </button>

        </form>

      </li>

    </ul>

    <div id="account-nav">
      <a
        href="/account.html"
        class="account-link"
      >
        LOG IN
      </a>
    </div>

    <div class="lang-switcher" id="lang-switcher">
    <button type="button" data-lang="en">EN</button>
    <button type="button" data-lang="es">ES</button>
    <button type="button" data-lang="zh">中文</button>
  </div>

</nav>

<div id="google_translate_element" style="display: none;"></div>


  <main>

    <h1 class="page-title">News</h1>

    <p class="page-description">
      The latest updates and articles from our team.
    </p>

    <div id="news-list"></div>

    <div id="empty-message" style="display: none;">
      No articles published yet.
    </div>

    <div id="error-message" style="display: none;">
      Unable to load news articles.
    </div>

  </main>


  <script>

    const newsList =
      document.getElementById("news-list");

    const emptyMessage =
      document.getElementById("empty-message");

    const errorMessage =
      document.getElementById("error-message");


    function formatDate(dateString) {

      if (!dateString) {
        return "";
      }

      const date = new Date(dateString);

      return date.toLocaleDateString("en-US", {
        year: "numeric",
        month: "long",
        day: "numeric"
      });
    }


    async function loadNews() {

      try {

        const response = await fetch(
          `/api/movies?type=news&lang=${getSiteLanguage()}`
        );

        const data =
          await response.json();

        if (!response.ok) {
          errorMessage.style.display = "block";
          return;
        }

        const articles =
          data.results || [];

        if (articles.length === 0) {
          emptyMessage.style.display = "block";
          return;
        }

        for (const article of articles) {

          const card =
            document.createElement("a");

          card.className = "article-card";
          card.href =
            `/news-article.html?slug=${encodeURIComponent(article.slug)}`;

          const image = article.image_url
            ? `<img src="${article.image_url}" alt="${article.title}">`
            : `<img src="" alt="">`;

          card.innerHTML = `
            ${image}
            <div class="article-card-content">
              <h2>${article.title}</h2>
              <div class="meta">
                ${article.author || "Admin"} · ${formatDate(article.published_at)}
              </div>
              <div class="excerpt">
                ${article.excerpt || ""}
              </div>
            </div>
          `;

          newsList.appendChild(card);
        }

      } catch (error) {

        console.error(error);

        errorMessage.style.display = "block";
      }
    }

    loadNews();


    /* ACCOUNT NAV */

    async function updateAccountNav() {
      const accountNav = document.getElementById("account-nav");

      if (!accountNav) return;

      try {
        const response = await fetch("/api/current-user.js");

        if (!response.ok) {
          return;
        }

        const data = await response.json();

        if (!data.loggedIn) {
          return;
        }

        accountNav.innerHTML = `
          <a
            href="/account.html"
            class="profile-nav-icon"
            aria-label="My Profile"
            title="My Profile"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true"
            >
              <circle
                cx="12"
                cy="8"
                r="3.5"
                stroke="currentColor"
                stroke-width="1.8"
              />

              <path
                d="M5 20C5.8 16.6 8.2 14.5 12 14.5C15.8 14.5 18.2 16.6 19 20"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
              />
            </svg>
          </a>
        `;

      } catch (error) {
        console.error("Could not check account status:", error);
      }
    }

    updateAccountNav();

  /* LANGUAGE SWITCHER */

  function getSiteLanguage() {
    const match = document.cookie.match(/googtrans=\/en\/([a-zA-Z-]+)/);

    if (!match) {
      return "en";
    }

    const code = match[1].toLowerCase();

    if (code === "es") {
      return "es";
    }

    if (code === "zh-cn") {
      return "zh";
    }

    return "en";
  }

  function setSiteLanguage(lang) {

    document.cookie =
      "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";

    if (lang !== "en") {

      const googleCode =
        lang === "zh" ? "zh-CN" : lang;

      document.cookie =
        `googtrans=/en/${googleCode}; path=/`;
    }

    location.reload();
  }

  function highlightActiveLanguageButton() {
    const currentLang = getSiteLanguage();

    document
      .querySelectorAll("#lang-switcher button")
      .forEach(button => {
        button.classList.toggle(
          "active",
          button.dataset.lang === currentLang
        );
      });
  }

  document
    .querySelectorAll("#lang-switcher button")
    .forEach(button => {
      button.addEventListener("click", () => {
        setSiteLanguage(button.dataset.lang);
      });
    });

  highlightActiveLanguageButton();




    /* SEARCH */

    const searchForm =
      document.getElementById("search-form");

    const searchInput =
      document.getElementById("search-input");

    searchForm.addEventListener("submit", event => {
      event.preventDefault();

      const query = searchInput.value.trim();

      if (!query) {
        return;
      }

      window.location.href =
        `/search.html?query=${encodeURIComponent(query)}`;
    });

  </script>


<script>
  function googleTranslateElementInit() {
    new google.translate.TranslateElement(
      {
        pageLanguage: "en",
        includedLanguages: "es,zh-CN",
        autoDisplay: false
      },
      "google_translate_element"
    );
  }
</script>
<script
  src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"
></script>

</body>
</html>

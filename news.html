<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>News</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 60px auto;
      padding: 20px;
    }

    h1 {
      margin-bottom: 30px;
    }

    #news-list {
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    .article-card {
      display: flex;
      gap: 20px;
      border-bottom: 1px solid #ccc;
      padding-bottom: 30px;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
    }

    .article-card img {
      width: 220px;
      height: 140px;
      object-fit: cover;
      flex-shrink: 0;
      background: #eee;
    }

    .article-card-content h2 {
      margin: 0 0 8px 0;
      font-size: 20px;
    }

    .article-card-content .meta {
      font-size: 13px;
      color: #666;
      margin-bottom: 10px;
    }

    .article-card-content .excerpt {
      font-size: 15px;
      color: #333;
      line-height: 1.4;
    }

    #empty-message,
    #error-message {
      color: #666;
    }

    @media (max-width: 600px) {
      .article-card {
        flex-direction: column;
      }

      .article-card img {
        width: 100%;
        height: 180px;
      }
    }
  </style>
</head>

<body>

  <h1>News</h1>

  <div id="news-list"></div>

  <div id="empty-message" style="display: none;">
    No articles published yet.
  </div>

  <div id="error-message" style="display: none;">
    Unable to load news articles.
  </div>


  <script>

    const newsList =
      document.getElementById("news-list");

    const emptyMessage =
      document.getElementById("empty-message");

    const errorMessage =
      document.getElementById("error-message");


    function formatDate(dateString) {

      if (!dateString) {
        return "";
      }

      const date = new Date(dateString);

      return date.toLocaleDateString("en-US", {
        year: "numeric",
        month: "long",
        day: "numeric"
      });
    }


    async function loadNews() {

      try {

        const response = await fetch(
          "/api/movies?type=news"
        );

        const data =
          await response.json();

        if (!response.ok) {
          errorMessage.style.display = "block";
          return;
        }

        const articles =
          data.results || [];

        if (articles.length === 0) {
          emptyMessage.style.display = "block";
          return;
        }

        for (const article of articles) {

          const card =
            document.createElement("a");

          card.className = "article-card";
          card.href =
            `/news-article.html?slug=${encodeURIComponent(article.slug)}`;

          const image = article.image_url
            ? `<img src="${article.image_url}" alt="${article.title}">`
            : `<img src="" alt="">`;

          card.innerHTML = `
            ${image}
            <div class="article-card-content">
              <h2>${article.title}</h2>
              <div class="meta">
                ${article.author || "Admin"} · ${formatDate(article.published_at)}
              </div>
              <div class="excerpt">
                ${article.excerpt || ""}
              </div>
            </div>
          `;

          newsList.appendChild(card);
        }

      } catch (error) {

        console.error(error);

        errorMessage.style.display = "block";
      }
    }

    loadNews();

  </script>

</body>
</html>
